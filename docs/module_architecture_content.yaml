# Per-module Design Architecture and Verification & Testing Methods for slide generation.
# Applied to docs/MODULEN.md before "## Topics Covered" by scripts/apply_module_architecture_content.py

modules:
  0:
    before_you_start:
      - "Clone the repo and read `docs/MODULE0.md` for toolchain expectations (GCC/Clang, Python 3.10+, Git, Make)"
      - "Confirm you have build essentials for Verilator (`sudo apt install build-essential` on Debian/Ubuntu) before running install scripts"
      - "Decide install modes: Verilator (`submodule`/`system`/`source`), cocotb/pyuvm (`pip` or `submodule`) — defaults work for most learners"
      - "Plan for a project-local venv at `.venv`; activate it (`source .venv/bin/activate`) before any Python checks"
      - "No RTL or simulation in this module — success means every tool probe passes before Module 1"
    key_files:
      - "`scripts/module0.sh` — orchestrator for Verilator, cocotb, and pyuvm install plus verification probes"
      - "`scripts/install_verilator.sh` — builds or links Verilator per `--verilator-mode`"
      - "`scripts/install_cocotb.sh` — installs cocotb into `.venv` or submodule tree"
      - "`scripts/install_pyuvm.sh` — installs pyuvm and pins course Python dependencies"
      - "`docs/MODULE0.md` — assessment checklist mapping environment readiness to course progress"
      - "`requirements.txt` / `pyproject.toml` — dependency versions consumed by pip install paths"
    commands:
      - title: Full toolchain install
        bullets:
          - "`./scripts/module0.sh` — install Verilator, cocotb, and pyuvm with default modes into `.venv`"
          - "`./scripts/module0.sh --verilator-mode system --cocotb-mode pip --pyuvm-mode pip` — explicit mode selection"
          - "`./scripts/module0.sh --skip-verilator` — refresh Python packages only when Verilator already present"
      - title: Verify without reinstalling
        bullets:
          - "`./scripts/module0.sh --verify-only` — probe `verilator`, `cocotb-config`, and `import pyuvm` without mutating the system"
          - "`verilator --version` — confirms simulator on PATH after submodule or system install"
          - "`python3 -c \"import cocotb, pyuvm; print('OK')\"` — quick venv sanity check outside the orchestrator"
      - title: Manual probes (debug)
        bullets:
          - "`which verilator && cocotb-config --version` — separate PATH issues from Python import failures"
          - "`source .venv/bin/activate` — required before manual Python probes if `--no-venv` was not used"
          - "Re-run `--verify-only` after OS updates, submodule pulls, or venv recreation"
    design:
      - title: Toolchain and repository layout
        bullets:
          - "Course root: `docs/`, `moduleN/`, `scripts/moduleN.sh`, `media/moduleN/` for slides and video"
          - "Python 3.10+ virtual environment (`.venv`) holds cocotb, pyuvm, and course dependencies"
          - "Verilator compiles RTL when modules include `dut/`; cocotb bridges Python testbenches to the simulator"
          - "Orchestrator `scripts/module0.sh` installs and verifies Verilator, cocotb, and pyuvm in order"
      - title: Verification stack architecture
        bullets:
          - "Bottom layer: OS, compiler (GCC/Clang), Make/Ninja, Git"
          - "Simulator layer: Verilator (default) produces fast cycle-accurate models from SystemVerilog/Verilog"
          - "Testbench layer: cocotb (coroutine-driven) and pyuvm (UVM 1.2 in Python) share the same venv"
          - "Artifacts: logs under module runs, optional VCD/FST waveforms from Make targets in later modules"
      - title: Execution pipeline
        bullets:
          - "Install: `module0.sh` → dependency scripts → venv population → version probes (no compile/sim/check loop yet)"
          - "Build: not applicable — no DUT or Makefile targets in Module 0"
          - "Sim: not applicable — cocotb/Verilator coupling is validated only via import and `--version` probes"
          - "Check: `--verify-only` aggregates pass/fail; all three tools must report OK before Module 1 labs"
      - title: What is not in this module
        bullets:
          - "No DUT or UVM hierarchy — focus is reproducible environment setup"
          - "Later modules attach Python tests to RTL under `moduleN/dut/`"
          - "Self-check only validates tools; functional verification starts in Module 1"
          - "Waveforms, scoreboards, and regression Makefiles appear from Module 1 onward"
    testing:
      - title: Installation verification strategy
        bullets:
          - "Run `./scripts/module0.sh` for full install or per-tool flags (`--verilator-mode`, `--cocotb-mode`, `--pyuvm-mode`)"
          - "`./scripts/module0.sh --verify-only` confirms `verilator`, `cocotb-config`, and importable `pyuvm`"
          - "Version probes (`verilator --version`, `python -c 'import cocotb'`) catch PATH and venv mistakes early"
      - title: Smoke and regression mindset
        bullets:
          - "Treat install as the first regression: every tool must pass before Module 1 labs"
          - "Re-run `--verify-only` after OS updates or submodule pulls"
          - "Document failures in install logs; fix one layer at a time (compiler → Verilator → Python packages)"
      - title: Step-by-step lab execution
        bullets:
          - "1. From repo root: `./scripts/module0.sh` (or selective `--skip-*` flags if tools already installed)"
          - "2. Activate venv: `source .venv/bin/activate`"
          - "3. Verify: `./scripts/module0.sh --verify-only` — expect green checks for Verilator, cocotb, pyuvm"
          - "4. Optional manual probes: `verilator --version`, `cocotb-config --version`, `python3 -c 'import pyuvm'`"
          - "5. Record pass in MODULE0 assessment checklist; proceed to Module 1 only when all probes succeed"
      - title: Closure for Module 0
        bullets:
          - "Pass criteria: all install scripts succeed and `--verify-only` reports required tools present"
          - "Optional: run a minimal cocotb compile in Module 1 only after Module 0 passes"
          - "Assessment checklist in `docs/MODULE0.md` maps environment readiness to course progress"

  1:
    before_you_start:
      - "Complete Module 0 (`./scripts/module0.sh --verify-only`) so Verilator, cocotb, and pyuvm are available in `.venv`"
      - "Skim `docs/MODULE1.md` and run pure Python examples first — no simulator required for OOP/async foundations"
      - "Review `module1/dut/simple_gates/` RTL (AND gate, counter) before opening cocotb tests"
      - "Understand the testbench mental model: DUT ← driver/stimulus ← test ← checker ← monitor"
      - "Keep venv active; cocotb Makefiles expect `SIM=verilator` and `COCOTB_REDIRECT_OUTPUT=1` defaults from course Makefiles"
    key_files:
      - "`module1/dut/simple_gates/and_gate.v` — 2-input AND; first combinational DUT for cocotb handles"
      - "`module1/dut/simple_gates/counter.v` — clocked counter with enable/reset for sequential labs"
      - "`module1/examples/python_basics/transaction.py` — transaction class with `__eq__`/`__hash__` patterns"
      - "`module1/tests/cocotb_tests/test_and_gate.py` — directed cocotb vectors and edge triggers"
      - "`module1/tests/pyuvm_tests/test_and_gate_uvm.py` — minimal pyuvm hierarchy on the AND gate"
      - "`scripts/module1.sh` — routes Python examples and `--cocotb-tests` / `--pyuvm-tests` regressions"
    commands:
      - title: Python examples (no simulator)
        bullets:
          - "`./scripts/module1.sh` — runs all five Python example tracks (default)"
          - "`./scripts/module1.sh --decorators --async-await` — selective example subsets"
          - "`python3 module1/examples/python_basics/transaction.py` — standalone OOP/transaction drill"
      - title: cocotb RTL tests
        bullets:
          - "`./scripts/module1.sh --cocotb-tests` — build and run cocotb regressions via orchestrator"
          - "`cd module1/tests/cocotb_tests && make SIM=verilator TEST=test_and_gate` — single-test Makefile flow"
          - "`make SIM=verilator TEST=test_counter` — sequential counter regression with reset/enable checks"
      - title: pyuvm entry tests
        bullets:
          - "`./scripts/module1.sh --pyuvm-tests` — compile RTL and run introductory pyuvm test against AND gate"
          - "`cd module1/tests/pyuvm_tests && make SIM=verilator` — direct Make entry when debugging pyuvm wiring"
          - "`./scripts/module1.sh --all-tests` — Python examples plus cocotb and pyuvm test suites"
    design:
      - title: RTL block architecture
        bullets:
          - "DUTs in `module1/dut/simple_gates/` — `and_gate.v` (combinational) and `counter.v` (enable, active-low reset)"
          - "Synchronous blocks: clock, active-low reset, multi-bit data paths on the counter"
          - "Flat hierarchy — no buses; ideal for first cocotb signal access and pyuvm hook-up"
      - title: Python verification layer architecture
        bullets:
          - "`module1/examples/` — pure Python (transactions, decorators, async, data structures, logging)"
          - "`module1/tests/cocotb_tests/` — coroutine testbenches driving RTL via cocotb handles"
          - "`module1/tests/pyuvm_tests/` — minimal UVM-style hierarchy introduction"
          - "Transaction classes in `examples/python_basics/transaction.py` model stimulus items reused in TB thinking"
      - title: Execution pipeline
        bullets:
          - "Build: Verilator compiles `module1/dut/simple_gates/*.v` via cocotb Makefile (`VERILOG_SOURCES`, top module)"
          - "Sim: cocotb loads Python test module; coroutines advance time on `RisingEdge(clk)` and combinational reads"
          - "Check: assertions in test functions plus cocotb `TestSuccess`/`TestFailure`; pyuvm tests report UVM status"
          - "Orchestrator path: `module1.sh --cocotb-tests` wraps `make` with venv and simulator checks"
      - title: Testbench mental model
        bullets:
          - "DUT (RTL) ← driver/stimulus ← test ← checker/scoreboard ← monitor → observations"
          - "Simulation time advances on clock edges; Python coroutines (`async`/`await`) align with cocotb"
          - "Assertions and logging close the loop between expected and actual behavior"
          - "Python examples teach patterns (transactions, async) reused when pyuvm sequences appear in Module 3"
    testing:
      - title: cocotb testing methods
        bullets:
          - "Tests in `test_and_gate.py`, `test_counter.py`: reset, directed vectors, edge cases"
          - "Run: `cd module1/tests/cocotb_tests && make SIM=verilator TEST=test_and_gate`"
          - "Triggers: `RisingEdge(clk)`, `ReadOnly`/`Write` phases for signal stability"
      - title: pyuvm and Python unit-style checks
        bullets:
          - "`./scripts/module1.sh --pyuvm-tests` — compile/run introductory pyuvm tests against simple DUTs"
          - "Examples run without simulator (`python3 module1/examples/...`) to teach OOP patterns first"
          - "Error-handling example shows structured logging for debuggable regressions"
      - title: Step-by-step lab execution
        bullets:
          - "1. Run Python track: `./scripts/module1.sh` (or individual `--python-basics`, `--async-await`, …)"
          - "2. cocotb AND gate: `cd module1/tests/cocotb_tests && make SIM=verilator TEST=test_and_gate`"
          - "3. cocotb counter: `make SIM=verilator TEST=test_counter` — observe reset and enable sequencing"
          - "4. pyuvm entry: `./scripts/module1.sh --pyuvm-tests` — confirm UVM-style test completes without fatals"
          - "5. Full regression: `./scripts/module1.sh --all-tests` before MODULE1 assessment sign-off"
      - title: Closure and self-check
        bullets:
          - "`./scripts/module1.sh --all-tests` runs required examples and simulator-backed tests"
          - "Combine directed cocotb tests with transaction equality (`__eq__`, `__hash__`) from Python examples"
          - "Assessment: OOP for verification, basic TB structure, cocotb + pyuvm entry points"

  2:
    before_you_start:
      - "Finish Module 1 cocotb labs so clock/reset coroutine patterns are familiar"
      - "Read `module2/dut/registers/simple_register.v` and `shift_register.v` port lists before writing stimulus"
      - "Work through `module2/examples/triggers/` — `RisingEdge`, `FallingEdge`, and `Timer` are core to all Module 2 tests"
      - "Study `module2/examples/clock_generation/` and `reset_patterns/` — shared fixtures decouple timing from test logic"
      - "No pyuvm yet; tests are flat `@cocotb.test` functions selected by Makefile `TEST=`"
    key_files:
      - "`module2/dut/registers/simple_register.v` — 8-bit register with enable and synchronous reset (primary lab DUT)"
      - "`module2/dut/registers/shift_register.v` — serial in/out with parallel tap; multi-cycle behavior"
      - "`module2/examples/triggers/triggers_example.py` — cocotb trigger primitives and concurrency"
      - "`module2/tests/cocotb_tests/test_simple_register.py` — directed write/read and boundary values"
      - "`module2/tests/cocotb_tests/test_shift_register.py` — serial shift timing regression"
      - "`scripts/module2.sh` — routes example makes and `--cocotb-tests` regressions"
    commands:
      - title: cocotb examples (tutorial makes)
        bullets:
          - "`./scripts/module2.sh --triggers` — run trigger tutorial under `module2/examples/triggers/`"
          - "`./scripts/module2.sh --clock-generation --reset-patterns` — timing and reset fixture drills"
          - "`./scripts/module2.sh` — all five example tracks (signal access through common patterns)"
      - title: DUT regression tests
        bullets:
          - "`./scripts/module2.sh --cocotb-tests` — register and shift-register makes via orchestrator"
          - "`cd module2/tests/cocotb_tests && make SIM=verilator TEST=test_simple_register`"
          - "`make SIM=verilator TEST=test_shift_register` — serial timing and parallel output checks"
      - title: Debug and waves
        bullets:
          - "`make SIM=verilator TEST=test_simple_register WAVES=1` — enable VCD/FST when Makefile supports it"
          - "Use `cocotb.log` verbosity and simulator stdout from `results.xml` for pass/fail triage"
          - "Re-run single `TEST=` target after RTL or stimulus edits — faster than full example sweep"
    design:
      - title: RTL portfolio architecture
        bullets:
          - "`simple_register.v` — 8-bit register, enable, synchronous reset (primary lab DUT)"
          - "`shift_register.v` — serial in/out, parallel tap; exercises multi-cycle behavior"
          - "`simple_fifo.v` — 16×8 FIFO with full/empty flags (reference for extension)"
          - "`simple_fsm.v` — IDLE/START/WORK/DONE four-state controller (optional study)"
      - title: cocotb testbench architecture
        bullets:
          - "Test module → coroutines (`@cocotb.test`) → DUT signals via `dut.signal` handles"
          - "Clock generators in examples decouple timing from test logic"
          - "No UVM hierarchy; flat Python functions and shared fixtures via Makefile `TEST=` selection"
          - "Concurrent coroutines use triggers to model parallel clock, reset, and stimulus threads"
      - title: Execution pipeline
        bullets:
          - "Build: Verilator compiles selected DUT under `module2/dut/registers/` per Makefile top module"
          - "Sim: cocotb schedules coroutines on triggers; reset coroutines establish known state before stimulus"
          - "Check: Python assertions on `dut.q.value` / shift outputs; cocotb regression aggregates `results.xml`"
          - "Examples path: `module2.sh --triggers` runs tutorial makes without full DUT regression"
      - title: Example vs test separation
        bullets:
          - "`module2/examples/` — signal access, clocks, triggers, reset patterns (runnable tutorials)"
          - "`module2/tests/cocotb_tests/` — regression tests bound to specific DUTs"
          - "Orchestrator `scripts/module2.sh` routes flags to examples or cocotb makes"
          - "Reference FIFO/FSM RTL supports self-study; graded labs focus on register and shift register"
    testing:
      - title: Stimulus and observation
        bullets:
          - "Directed writes/reads on register ports; shift tests exercise serial timing"
          - "`RisingEdge`/`FallingEdge`/`Timer` triggers structure concurrent activity"
          - "Reset tests run first in regression order to establish known state"
      - title: Regression and Makefile flow
        bullets:
          - "`make SIM=verilator TEST=test_simple_register` selects cocotb test module"
          - "Regression runner executes multiple tests; pass/fail per `cocotb.regression`"
          - "Boundary tests (`test_register_all_values`) cover 0x00, 0x7F, 0x80, 0xFF"
      - title: Step-by-step lab execution
        bullets:
          - "1. Tutorials: `./scripts/module2.sh --signal-access --triggers --reset-patterns`"
          - "2. Register lab: `cd module2/tests/cocotb_tests && make SIM=verilator TEST=test_simple_register`"
          - "3. Shift register lab: `make SIM=verilator TEST=test_shift_register` — verify serial-to-parallel timing"
          - "4. Full DUT regression: `./scripts/module2.sh --cocotb-tests`"
          - "5. Debug failures with waves/logging before MODULE2 assessment"
      - title: Debug and closure
        bullets:
          - "Logging via `cocotb.log`; VCD from simulator flags for waveform debug"
          - "`./scripts/module2.sh --cocotb-tests` validates key cocotb tests and example makes"
          - "Assessment: clocks, triggers, reset sequences, structured cocotb tests"

  3:
    before_you_start:
      - "Solid cocotb skills from Module 2 — you will reuse trigger timing inside pyuvm drivers later"
      - "Read `module3/dut/simple_blocks/adder.v` — combinational operands `a`, `b`, output `sum`"
      - "Step through `module3/examples/phases/` and `class_hierarchy/` before integrated `test_simple_uvm.py`"
      - "Understand UVM phase order: build → connect → run (with objections) → report"
      - "ConfigDB and factory examples are isolated; run them before merging concepts in the pyuvm test"
    key_files:
      - "`module3/dut/simple_blocks/adder.v` — primary combinational DUT for UVM structure labs"
      - "`module3/examples/phases/phases_example.py` — phase callbacks and simulation lifetime"
      - "`module3/examples/configdb/configdb_example.py` — virtual interface and parameter publishing"
      - "`module3/examples/factory/factory_example.py` — type overrides without hierarchy edits"
      - "`module3/tests/pyuvm_tests/test_simple_uvm.py` — integrated test → env → agent → adder DUT"
      - "`scripts/module3.sh` — per-topic flags (`--phases`, `--factory`, …) plus `--pyuvm-tests`"
    commands:
      - title: Isolated UVM API examples
        bullets:
          - "`./scripts/module3.sh --phases --reporting` — phase and verbosity drills"
          - "`./scripts/module3.sh --configdb --factory --objections` — ConfigDB, factory, objection tracks"
          - "`./scripts/module3.sh --class-hierarchy` — component tree and TLM port basics"
      - title: Integrated pyuvm simulation
        bullets:
          - "`./scripts/module3.sh --pyuvm-tests` — default integrated regression against adder DUT"
          - "`cd module3/tests/pyuvm_tests && make SIM=verilator TEST=test_simple_uvm` — direct Make debug path"
          - "`./scripts/module3.sh --skip-examples --pyuvm-tests` — jump to integrated test when API drills are done"
      - title: Verbosity and overrides
        bullets:
          - "Set `PYUVM_VERBOSITY` or plusargs (when supported) to filter UVM report noise during debug"
          - "Factory overrides in examples swap test/agent types — mirror pattern in integrated test"
          - "Re-run single example Make target under `module3/examples/<topic>/` for fast iteration"
    design:
      - title: RTL and interfaces
        bullets:
          - "Primary DUT: `module3/dut/simple_blocks/adder.v` — combinational operands and sum"
          - "Clock/reset scaffolding for pyuvm tests that mirror industry TB hooks"
          - "Flat block; no protocol channels — focus stays on UVM structure, not bus complexity"
      - title: UVM testbench architecture
        bullets:
          - "Hierarchy: `uvm_test` → `uvm_env` → `uvm_agent` (driver, monitor, sequencer) → DUT"
          - "`uvm_sequence_item` / `uvm_sequence` carry transactions; driver converts items to pin wiggles"
          - "ConfigDB publishes virtual interfaces and parameters before `build_phase`"
          - "Factory + objections control creation and phase lifetime"
      - title: Execution pipeline
        bullets:
          - "Build: Verilator compiles adder RTL; pyuvm `build_phase` constructs test/env/agent/component tree"
          - "Connect: TLM ports linked in `connect_phase`; ConfigDB delivers virtual interface handles to driver/monitor"
          - "Sim/run: sequences start on sequencer; driver applies operands; objections hold run phase until sequences finish"
          - "Check/report: monitor samples `sum`; UVM report phase summarizes errors; expect UVM TEST PASSED"
      - title: Module layout
        bullets:
          - "`module3/examples/` — isolated API demos (phases, reporting, configdb, factory, objections)"
          - "`module3/tests/pyuvm_tests/` — integrated `make SIM=verilator TEST=test_simple_uvm` flows"
          - "Each example directory has its own Makefile for incremental learning"
          - "Assessment maps each example topic to integrated test behaviors"
    testing:
      - title: Phase-based test execution
        bullets:
          - "build → connect → end_of_elaboration → start_of_simulation → run → extract → report"
          - "Objections in run phase prevent premature finish until sequences complete"
          - "Reporting verbosity filters debug vs error messages"
      - title: Stimulus and checking
        bullets:
          - "Directed sequences on adder operands; monitor samples outputs for scoreboard hooks"
          - "Factory overrides swap test/agent types without editing hierarchy code"
          - "ConfigDB sets agent active/passive and interface handles"
      - title: Step-by-step lab execution
        bullets:
          - "1. API drills: `./scripts/module3.sh --class-hierarchy --phases --configdb`"
          - "2. Factory/objections: `./scripts/module3.sh --factory --objections`"
          - "3. Integrated test: `./scripts/module3.sh --pyuvm-tests` (or `make TEST=test_simple_uvm`)"
          - "4. Confirm simulation log shows phase progression and no UVM_ERROR/FATAL"
          - "5. Optional: factory override exercise from examples, re-run integrated test to observe swapped types"
      - title: Closure
        bullets:
          - "`./scripts/module3.sh --pyuvm-tests` and per-topic flags (`--phases`, `--factory`, …)"
          - "Pass when simulation report shows UVM TEST PASSED and no fatal errors"
          - "Assessment: class hierarchy, phases, configdb, factory, objections"

  4:
    before_you_start:
      - "Module 3 UVM hierarchy and phases must be comfortable — agents bundle components you studied separately"
      - "Study `module4/dut/interfaces/simple_interface.v` valid/ready handshake before driver labs"
      - "Run examples in order: transactions → driver → monitor → sequencer → scoreboard → TLM → agents"
      - "Read `InterfaceTransaction` field definitions and `copy`/`compare` before scoreboard integration"
      - "Integrated capstone is `test_complete_agent.py` — do not skip per-component examples"
    key_files:
      - "`module4/dut/interfaces/simple_interface.v` — valid/ready streaming interface with addr/data/result"
      - "`module4/examples/transactions/transaction_example.py` — sequence item fields and compare/copy"
      - "`module4/examples/drivers/driver_example.py` — sequencer pull loop and pin wiggling"
      - "`module4/examples/monitors/monitor_example.py` — passive sampling and analysis port broadcast"
      - "`module4/tests/pyuvm_tests/test_complete_agent.py` — end-to-end agent, env, scoreboard integration"
      - "`scripts/module4.sh` — `--drivers` … `--agents` example flags and `--pyuvm-tests`"
    commands:
      - title: Per-component examples
        bullets:
          - "`./scripts/module4.sh --transactions --drivers --monitors` — stimulus and observation building blocks"
          - "`./scripts/module4.sh --sequencers --scoreboards --tlm` — sequence flow and analysis connections"
          - "`./scripts/module4.sh --agents` — complete agent wiring before capstone test"
      - title: Integration test
        bullets:
          - "`./scripts/module4.sh --pyuvm-tests` — run `test_complete_agent` via orchestrator"
          - "`cd module4/tests/pyuvm_tests && make SIM=verilator TEST=test_complete_agent`"
          - "`./scripts/module4.sh --skip-examples --pyuvm-tests` — capstone only when components are understood"
      - title: Debug paths
        bullets:
          - "Run individual example Make under `module4/examples/<component>/` to isolate failures"
          - "Increase UVM verbosity to trace sequence → driver → monitor transaction paths"
          - "Verilator waveforms on interface valid/ready when handshake debug is needed"
    design:
      - title: DUT and interface protocol
        bullets:
          - "`module4/dut/interfaces/simple_interface.v` — valid/ready handshake, address/data/result buses"
          - "Clocked, resettable interface models streaming transactions"
          - "Agent maps one transaction type to one interface beat"
      - title: Agent-centric UVM architecture
        bullets:
          - "Agent bundles driver, monitor, sequencer; env holds agent + scoreboard"
          - "TLM analysis ports connect monitor → scoreboard (and optional coverage)"
          - "`InterfaceTransaction` defines fields, `copy`/`compare`, and constraints"
          - "Complete path: sequence → sequencer → driver → DUT → monitor → scoreboard"
      - title: Execution pipeline
        bullets:
          - "Build: Verilator compiles `simple_interface.v`; env builds agent (driver, monitor, sequencer) and scoreboard"
          - "Connect: monitor `ap` → scoreboard `exp`/`act` analysis imports; sequencer ↔ driver TLM ports"
          - "Sim: sequence items drive valid/ready beats; monitor reconstructs transactions on completed handshakes"
          - "Check: scoreboard `compare` on monitored vs predicted streams; UVM report summarizes mismatches"
      - title: Component responsibilities
        bullets:
          - "Driver: pull items from sequencer, drive pins per protocol"
          - "Monitor: passive observation, broadcast transactions on analysis port"
          - "Sequencer: arbitration and sequence execution"
          - "Scoreboard: expected vs actual from monitor streams"
    testing:
      - title: Integration testing method
        bullets:
          - "`test_complete_agent.py` — end-to-end agent, env, and test class"
          - "Run: `./scripts/module4.sh --pyuvm-tests` or `make TEST=test_complete_agent`"
          - "Per-component examples (`driver_example.py`, …) isolate behavior before integration"
      - title: Checking strategy
        bullets:
          - "Scoreboard compares monitored results to predicted model or golden vectors"
          - "Analysis port fan-out allows multiple checkers without changing monitor"
          - "Sequences provide repeatable stimulus; random/constrained extensions in exercises"
      - title: Step-by-step lab execution
        bullets:
          - "1. Transactions: `./scripts/module4.sh --transactions`"
          - "2. Driver/monitor/sequencer: `./scripts/module4.sh --drivers --monitors --sequencers`"
          - "3. Scoreboard/TLM: `./scripts/module4.sh --scoreboards --tlm`"
          - "4. Agent assembly: `./scripts/module4.sh --agents`"
