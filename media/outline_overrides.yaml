# Demo command fixes and architecture code slides for generate_outline_from_module.py
# Keys: module number → demos | architecture

module0:
  demos:
    verilator_version:
      command: "verilator --version 2>&1 | head -1"
      expect: "Verilator"
    python_version:
      command: "python3 --version"
      expect: "Python"
  architecture:
    two_column: true
    design_code:
      title: "Install orchestrator (excerpt)"
      source_file: scripts/module0.sh
      start_line: 1
      end_line: 25
      notes: "Entry point for Verilator, cocotb, and pyuvm install order."
    method_code:
      title: "Verify toolchain probes"
      language: bash
      code: |
        ./scripts/module0.sh --verify-only
        verilator --version
        python3 -c "import cocotb, pyuvm; print('OK')"

