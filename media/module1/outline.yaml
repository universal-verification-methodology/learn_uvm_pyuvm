- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 1: DUT structure and key interfaces (see common_dut/rtl/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 1: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. RTL block architecture
  bullets:
  - DUTs in `module1/dut/simple_gates/` (AND gate) and `module1/dut/counters/` (counter
    with enable/reset)
  - 'Synchronous blocks: clock, active-low reset, multi-bit data paths'
  - Flat hierarchy — no buses; ideal for first cocotb signal access and pyuvm hook-up
  notes: From MODULE1 Design Architecture.
- type: bullets
  title: 2. Python verification layer architecture
  bullets:
  - '`module1/examples/` — pure Python (transactions, decorators, async, data structures,
    logging)'
  - '`module1/tests/cocotb_tests/` — coroutine testbenches driving RTL via cocotb
    handles'
  - '`module1/tests/pyuvm_tests/` — minimal UVM-style hierarchy introduction'
  - Transaction classes in `examples/python_basics/transaction.py` model stimulus
    items reused in TB thinking
  notes: From MODULE1 Design Architecture.
- type: bullets
  title: 3. Testbench mental model
  bullets:
  - DUT (RTL) ← driver/stimulus ← test ← checker/scoreboard ← monitor → observations
  - Simulation time advances on clock edges; Python coroutines (`async`/`await`) align
    with cocotb
  - Assertions and logging close the loop between expected and actual behavior
  notes: From MODULE1 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 1: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. cocotb testing methods
  bullets:
  - 'Tests in `test_and_gate.py`, `test_counter.py`: reset, directed vectors, edge
    cases'
  - 'Run: `cd module1/tests/cocotb_tests && make SIM=verilator TEST=test_and_gate`'
  - 'Triggers: `RisingEdge(clk)`, `ReadOnly`/`Write` phases for signal stability'
  notes: From MODULE1 Verification & Testing Methods.
- type: bullets
  title: 2. pyuvm and Python unit-style checks
  bullets:
  - '`./scripts/module1.sh --pyuvm-tests` — compile/run introductory pyuvm tests against
    simple DUTs'
  - Examples run without simulator (`python3 module1/examples/...`) to teach OOP patterns
    first
  - Error-handling example shows structured logging for debuggable regressions
  notes: From MODULE1 Verification & Testing Methods.
- type: bullets
  title: 3. Closure and self-check
  bullets:
  - '`./scripts/module1.sh --check` runs required examples and tests'
  - Combine directed cocotb tests with transaction equality (`__eq__`, `__hash__`)
    from Python examples
  - 'Assessment: OOP for verification, basic TB structure, cocotb + pyuvm entry points'
  notes: From MODULE1 Verification & Testing Methods.
