  - WriteTransaction(id=3, address=0x2000, data=0xBEEF)
  - 'Class Variables: `_id_counter` is shared across all instances'
  notes: From MODULE1 Topics Covered.
- type: bullets
  title: 1. Python Classes and Inheritance for Verification (6/6)
  bullets:
