- type: bullets
  title: Suggested learning path
  bullets:
  - Complete Module 0 (`./scripts/module0.sh --verify-only`) so Verilator, cocotb,
    and pyuvm are available in `.venv`
  - Skim `docs/MODULE1.md` and run pure Python examples first — no simulator required
    for OOP/async foundations
  - Review `module1/dut/simple_gates/` RTL (AND gate, counter) before opening cocotb
    tests
  - 'Understand the testbench mental model: DUT ← driver/stimulus ← test ← checker
    ← monitor'
  - Keep venv active; cocotb Makefiles expect `SIM=verilator` and `COCOTB_REDIRECT_OUTPUT=1`
    defaults from course Makefiles
  notes: From docs/MODULE1.md — read guides before running demos.
- type: section
  title: Design architecture
- type: two_column
  title: 1. RTL block architecture
  left:
  - DUTs in `module1/dut/simple_gates/` — `and_gate.v` (combinational) and `counter.v`
    (enable, active-low reset)
  - 'Synchronous blocks: clock, active-low reset, multi-bit data paths on the counter'
  - Flat hierarchy — no buses; ideal for first cocotb signal access and pyuvm hook-up
  right: assets/diagrams/rtl_architecture.png
  notes: From MODULE1 Design Architecture.
- type: two_column
  title: 2. Python verification layer architecture
  left:
  - '`module1/examples/` — pure Python (transactions, decorators, async, data structures,
    logging)'
  - '`module1/tests/cocotb_tests/` — coroutine testbenches driving RTL via cocotb
    handles'
  - '`module1/tests/pyuvm_tests/` — minimal UVM-style hierarchy introduction'
  - Transaction classes in `examples/python_basics/transaction.py` model stimulus
    items reused in TB thinking
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE1 Design Architecture.
- type: bullets
  title: 3. Execution pipeline
  bullets:
  - 'Build: Verilator compiles `module1/dut/simple_gates/*.v` via cocotb Makefile
    (`VERILOG_SOURCES`, top module)'
  - 'Sim: cocotb loads Python test module; coroutines advance time on `RisingEdge(clk)`
    and combinational reads'
  - 'Check: assertions in test functions plus cocotb `TestSuccess`/`TestFailure`;
    pyuvm tests report UVM status'
  - 'Orchestrator path: `module1.sh --cocotb-tests` wraps `make` with venv and simulator
    checks'
  notes: From MODULE1 Design Architecture.
- type: bullets
  title: 4. Testbench mental model
  bullets:
  - DUT (RTL) ← driver/stimulus ← test ← checker/scoreboard ← monitor → observations
  - Simulation time advances on clock edges; Python coroutines (`async`/`await`) align
    with cocotb
  - Assertions and logging close the loop between expected and actual behavior
  - Python examples teach patterns (transactions, async) reused when pyuvm sequences
    appear in Module 3
  notes: From MODULE1 Design Architecture.
- type: code
  title: DUT — AND gate ports
  language: systemverilog
  source_file: module1/dut/simple_gates/and_gate.v
  code: "module and_gate (\n    input  wire a,\n    input  wire b,\n    output reg\
    \  y\n);\n\n    always @(*) begin\n        y = a & b;\n    end\n\nendmodule"
  notes: Flat combinational block; cocotb accesses dut.a, dut.b, dut.y.
- type: code
  title: cocotb — drive inputs and assert
  language: text
  source_file: module1/tests/cocotb_tests/test_and_gate.py
  code: "@cocotb.test()\nasync def test_and_gate_basic(dut):\n    \"\"\"\n    Basic\
    \ AND gate test.\n    \n    Tests all input combinations.\n    \"\"\"\n    # Initialize\
    \ inputs\n    dut.a.value = 0\n    dut.b.value = 0\n    \n    # Wait for initial\
    \ values to settle\n    await Timer(10, units=\"ns\")\n    \n    # Test case 1:\
    \ 0 & 0 = 0\n    dut.a.value = 0\n    dut.b.value = 0\n    await Timer(10, units=\"\
    ns\")\n// ..."
