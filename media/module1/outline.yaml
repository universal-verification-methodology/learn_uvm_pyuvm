    from Python examples
  - 'Assessment: OOP for verification, basic TB structure, cocotb + pyuvm entry points'
  notes: From MODULE1 Verification & Testing Methods.
- type: code
  title: Makefile — build and run flow
  language: text
  source_file: module1/tests/cocotb_tests/Makefile
  code: '# Makefile for Module 1 cocotb tests

    # Usage: make SIM=verilator test_and_gate


    # Default simulator

    SIM ?= verilator


    # Python files

    PYTHON_FILES = test_and_gate.py test_counter.py


    # Verilog files

    VERILOG_FILES = ../../dut/simple_gates/and_gate.v ../../dut/simple_gates/counter.v


    # Test to run

    TEST ?= test_and_gate


    # Cocotb variables

    MODULE = $(TEST)

    TOPLEVEL = $(shell echo $(TEST) | sed ''s/test_//'')

    // ...'
  notes: SIM=verilator, TEST= selects cocotb module; cocotb-config drives compile.
