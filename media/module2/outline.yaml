- type: section
  title: How to learn this module
- type: bullets
  title: Suggested learning path
  bullets:
  - Finish Module 1 cocotb labs so clock/reset coroutine patterns are familiar
  - Read `module2/dut/registers/simple_register.v` and `shift_register.v` port lists
    before writing stimulus
  - Work through `module2/examples/triggers/` — `RisingEdge`, `FallingEdge`, and `Timer`
    are core to all Module 2 tests
  - Study `module2/examples/clock_generation/` and `reset_patterns/` — shared fixtures
    decouple timing from test logic
  - No pyuvm yet; tests are flat `@cocotb.test` functions selected by Makefile `TEST=`
  notes: From docs/MODULE2.md — read guides before running demos.
- type: section
  title: Design architecture
- type: two_column
  title: 1. RTL portfolio architecture
  left:
  - '`simple_register.v` — 8-bit register, enable, synchronous reset (primary lab
    DUT)'
  - '`shift_register.v` — serial in/out, parallel tap; exercises multi-cycle behavior'
  - '`simple_fifo.v` — 16×8 FIFO with full/empty flags (reference for extension)'
  - '`simple_fsm.v` — IDLE/START/WORK/DONE four-state controller (optional study)'
  right: assets/diagrams/rtl_architecture.png
  notes: From MODULE2 Design Architecture.
- type: two_column
  title: 2. cocotb testbench architecture
  left:
  - Test module → coroutines (`@cocotb.test`) → DUT signals via `dut.signal` handles
  - Clock generators in examples decouple timing from test logic
  - No UVM hierarchy; flat Python functions and shared fixtures via Makefile `TEST=`
    selection
  - Concurrent coroutines use triggers to model parallel clock, reset, and stimulus
    threads
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE2 Design Architecture.
- type: bullets
  title: 3. Execution pipeline
  bullets:
  - 'Build: Verilator compiles selected DUT under `module2/dut/registers/` per Makefile
    top module'
  - 'Sim: cocotb schedules coroutines on triggers; reset coroutines establish known
    state before stimulus'
  - 'Check: Python assertions on `dut.q.value` / shift outputs; cocotb regression
    aggregates `results.xml`'
  - 'Examples path: `module2.sh --triggers` runs tutorial makes without full DUT regression'
  notes: From MODULE2 Design Architecture.
- type: bullets
  title: 4. Example vs test separation
  bullets:
  - '`module2/examples/` — signal access, clocks, triggers, reset patterns (runnable
    tutorials)'
  - '`module2/tests/cocotb_tests/` — regression tests bound to specific DUTs'
  - Orchestrator `scripts/module2.sh` routes flags to examples or cocotb makes
  - Reference FIFO/FSM RTL supports self-study; graded labs focus on register and
    shift register
  notes: From MODULE2 Design Architecture.
- type: code
  title: DUT — simple register
  language: systemverilog
  source_file: module2/dut/registers/simple_register.v
  code: "/**\n * Module 2: Simple Register\n * \n * A basic register with clock, reset,\
    \ and enable.\n * \n * Ports:\n *   clk:    Clock signal\n *   rst_n:  Active-low\
    \ reset\n *   enable: Register enable\n *   d:      Data input\n *   q:      Data\
    \ output\n */\n\nmodule simple_register (\n    input  wire       clk,\n    input\
    \  wire       rst_n,\n    input  wire       enable,\n    input  wire [7:0] d,\n\
    // ..."
- type: code
  title: cocotb — reset then write
  language: text
  source_file: module2/tests/cocotb_tests/test_simple_register.py
  code: "\"\"\"\nModule 2 Test: Simple Register\nComprehensive testbench for simple_register\
    \ module.\n\"\"\"\n\nimport cocotb\nfrom cocotb.clock import Clock\nfrom cocotb.triggers\
    \ import Timer, RisingEdge, FallingEdge\nfrom cocotb.binary import BinaryValue\n\
    \n\nasync def reset_dut(dut, duration_ns=50, propagation_delay_ns=10):\n    \"\
    \"\"\n    Reset the DUT.\n    \n    Args:\n        dut: Device under test\n  \
    \      duration_ns: Reset duration in nanoseconds\n// ..."
- type: section
  title: Key files to study
- type: bullets
  title: Open these in the repo
  bullets:
  - '`module2/dut/registers/simple_register.v` — 8-bit register with enable and synchronous
    reset (primary lab DUT)'
  - '`module2/dut/registers/shift_register.v` — serial in/out with parallel tap; multi-cycle
    behavior'
  - '`module2/examples/triggers/triggers_example.py` — cocotb trigger primitives and
    concurrency'
  - '`module2/tests/cocotb_tests/test_simple_register.py` — directed write/read and
    boundary values'
  - '`module2/tests/cocotb_tests/test_shift_register.py` — serial shift timing regression'
  - '`scripts/module2.sh` — routes example makes and `--cocotb-tests` regressions'
  notes: Trace while running module2/EXAMPLES.md labs.
- type: section
  title: Verification & testing methods
- type: two_column
  title: 1. Stimulus and observation
  left:
  - Directed writes/reads on register ports; shift tests exercise serial timing
  - '`RisingEdge`/`FallingEdge`/`Timer` triggers structure concurrent activity'
  - Reset tests run first in regression order to establish known state
  right: assets/diagrams/testing_methods.png
  notes: From MODULE2 Verification & Testing Methods.
- type: bullets
  title: 2. Regression and Makefile flow
  bullets:
  - '`make SIM=verilator TEST=test_simple_register` selects cocotb test module'
  - Regression runner executes multiple tests; pass/fail per `cocotb.regression`
  - Boundary tests (`test_register_all_values`) cover 0x00, 0x7F, 0x80, 0xFF
  notes: From MODULE2 Verification & Testing Methods.
- type: bullets
  title: 3. Step-by-step lab execution
  bullets:
  - '1. Tutorials: `./scripts/module2.sh --signal-access --triggers --reset-patterns`'
  - '2. Register lab: `cd module2/tests/cocotb_tests && make SIM=verilator TEST=test_simple_register`'
  - '3. Shift register lab: `make SIM=verilator TEST=test_shift_register` — verify
    serial-to-parallel timing'
  - '4. Full DUT regression: `./scripts/module2.sh --cocotb-tests`'
  - 5. Debug failures with waves/logging before MODULE2 assessment
  notes: From MODULE2 Verification & Testing Methods.
- type: bullets
  title: 4. Debug and closure
  bullets:
  - Logging via `cocotb.log`; VCD from simulator flags for waveform debug
  - '`./scripts/module2.sh --cocotb-tests` validates key cocotb tests and example
    makes'
  - 'Assessment: clocks, triggers, reset sequences, structured cocotb tests'
  notes: From MODULE2 Verification & Testing Methods.
- type: code
  title: Regression Makefile
  language: text
  source_file: module2/tests/cocotb_tests/Makefile
  code: '# Makefile for Module 2 cocotb tests

    # Usage: make SIM=verilator test_simple_register


    # Default simulator

    SIM ?= verilator


    # Python files

    PYTHON_FILES = test_simple_register.py test_shift_register.py


    # Verilog files

    VERILOG_FILES = ../../dut/registers/simple_register.v ../../dut/registers/shift_register.v


    # Test to run

    TEST ?= test_simple_register


    # Cocotb variables

    MODULE = $(TEST)

    TOPLEVEL = $(shell echo $(TEST) | sed ''s/test_//'')

    // ...'
