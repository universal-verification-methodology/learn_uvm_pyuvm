- type: image
  title: Learning path
  image: assets/diagrams/learning_path.png
  caption: Master UVM class hierarchy and phases
- type: bullets
  title: Overview
  bullets:
  - This module introduces the Universal Verification Methodology (UVM) and its implementation
    in pyuvm. You'll learn the fundamental UVM concepts, class hierarchy, phases,
    and how to structure UVM testbenches.
- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 3: DUT structure and key interfaces (see common_dut/rtl/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 3: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. RTL and interfaces
  bullets:
  - 'Primary DUT: `module3/dut/simple_blocks/adder.v` — combinational operands and
    sum'
  - Clock/reset scaffolding for pyuvm tests that mirror industry TB hooks
  - Flat block; no protocol channels — focus stays on UVM structure, not bus complexity
  notes: From MODULE3 Design Architecture.
- type: bullets
  title: 2. UVM testbench architecture
  bullets:
  - 'Hierarchy: `uvm_test` → `uvm_env` → `uvm_agent` (driver, monitor, sequencer)
    → DUT'
  - '`uvm_sequence_item` / `uvm_sequence` carry transactions; driver converts items
    to pin wiggles'
  - ConfigDB publishes virtual interfaces and parameters before `build_phase`
  - Factory + objections control creation and phase lifetime
  notes: From MODULE3 Design Architecture.
- type: bullets
  title: 3. Module layout
  bullets:
  - '`module3/examples/` — isolated API demos (phases, reporting, configdb, factory,
    objections)'
  - '`module3/tests/pyuvm_tests/` — integrated `make SIM=verilator TEST=test_simple_uvm`
    flows'
  notes: From MODULE3 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 3: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Phase-based test execution
  bullets:
  - build → connect → end_of_elaboration → start_of_simulation → run → extract → report
  - Objections in run phase prevent premature finish until sequences complete
  - Reporting verbosity filters debug vs error messages
  notes: From MODULE3 Verification & Testing Methods.
- type: bullets
  title: 2. Stimulus and checking
  bullets:
  - Directed sequences on adder operands; monitor samples outputs for scoreboard hooks
  - Factory overrides swap test/agent types without editing hierarchy code
  - ConfigDB sets agent active/passive and interface handles
  notes: From MODULE3 Verification & Testing Methods.
- type: bullets
  title: 3. Closure
  bullets:
  - '`./scripts/module3.sh --check` and per-topic flags (`--phases`, `--factory`,
    …)'
  - Pass when simulation report shows UVM TEST PASSED and no fatal errors
  - 'Assessment: class hierarchy, phases, configdb, factory, objections'
  notes: From MODULE3 Verification & Testing Methods.
