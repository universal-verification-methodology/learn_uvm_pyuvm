- type: section
  title: Verification & testing methods
- type: two_column
  title: 1. Installation verification strategy
  left:
  - Run `./scripts/module0.sh` for full install or per-tool flags (`--verilator-mode`,
    `--cocotb-mode`, `--pyuvm-mode`)
  - '`./scripts/module0.sh --verify-only` confirms `verilator`, `cocotb-config`, and
    importable `pyuvm`'
  - Version probes (`verilator --version`, `python -c 'import cocotb'`) catch PATH
    and venv mistakes early
  right: assets/diagrams/testing_methods.png
  notes: From MODULE0 Verification & Testing Methods.
- type: bullets
  title: 2. Smoke and regression mindset
  bullets:
  - 'Treat install as the first regression: every tool must pass before Module 1 labs'
  - Re-run `--verify-only` after OS updates or submodule pulls
  - Document failures in install logs; fix one layer at a time (compiler → Verilator
    → Python packages)
  notes: From MODULE0 Verification & Testing Methods.
- type: bullets
  title: 3. Step-by-step lab execution
  bullets:
  - '1. From repo root: `./scripts/module0.sh` (or selective `--skip-*` flags if tools
    already installed)'
  - '2. Activate venv: `source .venv/bin/activate`'
  - '3. Verify: `./scripts/module0.sh --verify-only` — expect green checks for Verilator,
    cocotb, pyuvm'
  - '4. Optional manual probes: `verilator --version`, `cocotb-config --version`,
    `python3 -c ''import pyuvm''`'
  - 5. Record pass in MODULE0 assessment checklist; proceed to Module 1 only when
    all probes succeed
  notes: From MODULE0 Verification & Testing Methods.
- type: bullets
  title: 4. Closure for Module 0
  bullets:
  - 'Pass criteria: all install scripts succeed and `--verify-only` reports required
    tools present'
  - 'Optional: run a minimal cocotb compile in Module 1 only after Module 0 passes'
  - Assessment checklist in `docs/MODULE0.md` maps environment readiness to course
    progress
  notes: From MODULE0 Verification & Testing Methods.
