- type: section
  title: Command reference highlights
- type: bullets
  title: Full toolchain install
  bullets:
  - '`./scripts/module0.sh` — install Verilator, cocotb, and pyuvm with default modes
    into `.venv`'
  - '`./scripts/module0.sh --verilator-mode system --cocotb-mode pip --pyuvm-mode
    pip` — explicit mode selection'
  - '`./scripts/module0.sh --skip-verilator` — refresh Python packages only when Verilator
    already present'
  notes: Full detail in docs/MODULE0.md command reference.
- type: bullets
  title: Verify without reinstalling
  bullets:
  - '`./scripts/module0.sh --verify-only` — probe `verilator`, `cocotb-config`, and
    `import pyuvm` without mutating the system'
  - '`verilator --version` — confirms simulator on PATH after submodule or system
    install'
  - '`python3 -c "import cocotb, pyuvm; print(''OK'')"` — quick venv sanity check
    outside the orchestrator'
  notes: Full detail in docs/MODULE0.md command reference.
- type: bullets
  title: Manual probes (debug)
  bullets:
  - '`which verilator && cocotb-config --version` — separate PATH issues from Python
    import failures'
  - '`source .venv/bin/activate` — required before manual Python probes if `--no-venv`
    was not used'
  - Re-run `--verify-only` after OS updates, submodule pulls, or venv recreation
  notes: Full detail in docs/MODULE0.md command reference.
