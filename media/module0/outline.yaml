- type: bullets
  title: 1. Toolchain and repository layout
  bullets:
  - 'Course root: `docs/`, `moduleN/`, `scripts/moduleN.sh`, `media/moduleN/` for
    slides and video'
  - Python 3.10+ virtual environment (`.venv`) holds cocotb, pyuvm, and course dependencies
  - Verilator compiles RTL when modules include `dut/`; cocotb bridges Python testbenches
    to the simulator
  - Orchestrator `scripts/module0.sh` installs and verifies Verilator, cocotb, and
    pyuvm in order
  notes: From MODULE0 Design Architecture.
- type: bullets
  title: 2. Verification stack architecture
  bullets:
  - 'Bottom layer: OS, compiler (GCC/Clang), Make/Ninja, Git'
  - 'Simulator layer: Verilator (default) produces fast cycle-accurate models from
    SystemVerilog/Verilog'
  - 'Testbench layer: cocotb (coroutine-driven) and pyuvm (UVM 1.2 in Python) share
    the same venv'
  - 'Artifacts: logs under module runs, optional VCD/FST waveforms from Make targets'
  notes: From MODULE0 Design Architecture.
- type: bullets
  title: 3. What is not in this module
  bullets:
  - No DUT or UVM hierarchy yet — focus is reproducible environment setup
  - Later modules attach Python tests to RTL under `moduleN/dut/`
  - Self-check only validates tools; functional verification starts in Module 1
  notes: From MODULE0 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 0: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Installation verification strategy
  bullets:
  - Run `./scripts/module0.sh` for full install or per-tool flags (`--verilator-mode`,
    `--cocotb-mode`, `--pyuvm-mode`)
  - '`./scripts/module0.sh --check` confirms `verilator`, `cocotb-config`, and importable
    `pyuvm`'
  - Version probes (`verilator --version`, `python -c 'import cocotb'`) catch PATH
    and venv mistakes early
  notes: From MODULE0 Verification & Testing Methods.
- type: bullets
  title: 2. Smoke and regression mindset
  bullets:
  - 'Treat install as the first regression: every tool must pass before Module 1 labs'
  - Re-run `--check` after OS updates or submodule pulls
  - Document failures in install logs; fix one layer at a time (compiler → Verilator
    → Python packages)
  notes: From MODULE0 Verification & Testing Methods.
- type: bullets
  title: 3. Closure for Module 0
  bullets:
  - 'Pass criteria: all install scripts succeed and `--check` reports required tools
    present'
  - 'Optional: run a minimal cocotb compile in Module 1 only after Module 0 passes'
  - Assessment checklist in MODULE0 maps environment readiness to course progress
  notes: From MODULE0 Verification & Testing Methods.
