- type: section
  title: How to learn this module
- type: bullets
  title: Suggested learning path
  bullets:
  - Clone the repo and read `docs/MODULE0.md` for toolchain expectations (GCC/Clang,
    Python 3.10+, Git, Make)
  - Confirm you have build essentials for Verilator (`sudo apt install build-essential`
    on Debian/Ubuntu) before running install scripts
  - 'Decide install modes: Verilator (`submodule`/`system`/`source`), cocotb/pyuvm
    (`pip` or `submodule`) — defaults work for most learners'
  - Plan for a project-local venv at `.venv`; activate it (`source .venv/bin/activate`)
    before any Python checks
  - No RTL or simulation in this module — success means every tool probe passes before
    Module 1
  notes: From docs/MODULE0.md — read guides before running demos.
- type: section
  title: Design architecture
- type: two_column
  title: 1. Toolchain and repository layout
  left:
  - 'Course root: `docs/`, `moduleN/`, `scripts/moduleN.sh`, `media/moduleN/` for
    slides and video'
  - Python 3.10+ virtual environment (`.venv`) holds cocotb, pyuvm, and course dependencies
  - Verilator compiles RTL when modules include `dut/`; cocotb bridges Python testbenches
    to the simulator
  - Orchestrator `scripts/module0.sh` installs and verifies Verilator, cocotb, and
    pyuvm in order
  right: assets/diagrams/rtl_architecture.png
  notes: From MODULE0 Design Architecture.
- type: two_column
  title: 2. Verification stack architecture
  left:
  - 'Bottom layer: OS, compiler (GCC/Clang), Make/Ninja, Git'
  - 'Simulator layer: Verilator (default) produces fast cycle-accurate models from
    SystemVerilog/Verilog'
  - 'Testbench layer: cocotb (coroutine-driven) and pyuvm (UVM 1.2 in Python) share
    the same venv'
  - 'Artifacts: logs under module runs, optional VCD/FST waveforms from Make targets
    in later modules'
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE0 Design Architecture.
- type: bullets
  title: 3. Execution pipeline
  bullets:
  - 'Install: `module0.sh` → dependency scripts → venv population → version probes
    (no compile/sim/check loop yet)'
  - 'Build: not applicable — no DUT or Makefile targets in Module 0'
  - 'Sim: not applicable — cocotb/Verilator coupling is validated only via import
    and `--version` probes'
  - 'Check: `--verify-only` aggregates pass/fail; all three tools must report OK before
    Module 1 labs'
  notes: From MODULE0 Design Architecture.
- type: bullets
  title: 4. What is not in this module
  bullets:
  - No DUT or UVM hierarchy — focus is reproducible environment setup
  - Later modules attach Python tests to RTL under `moduleN/dut/`
  - Self-check only validates tools; functional verification starts in Module 1
  - Waveforms, scoreboards, and regression Makefiles appear from Module 1 onward
  notes: From MODULE0 Design Architecture.
