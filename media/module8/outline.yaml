- type: bullets
  title: Prerequisites
  bullets:
  - See module README
- type: image
  title: Learning path
  image: assets/diagrams/learning_path.png
  caption: Master UVM utility classes and helper functions
- type: bullets
  title: Overview
  bullets:
  - This module covers the miscellaneous utilities provided by UVM that support verification
    environments. These utilities include command-line processing, comparators, recorders,
    object pools, queues, and various helper cla
- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 8: DUT structure and key interfaces (see common_dut/rtl/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 8: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. Utility layer in the testbench
  bullets:
  - No new large DUT focus — utilities plug into existing envs from prior modules
  - CLP (`uvm_cmdline_processor`) configures tests without recompilation
  - Comparators, recorders, pools, queues support analysis and debug infrastructure
  notes: From MODULE8 Design Architecture.
- type: bullets
  title: 2. How utilities attach
  bullets:
  - Comparators sit on analysis ports beside scoreboards
  - Recorders log transactions to files for offline review
  - Pools/queues manage recycled objects and ordered work lists
  - String/math/random helpers reduce boilerplate in checks and stimulus
  notes: From MODULE8 Design Architecture.
- type: bullets
  title: 3. Integration architecture
  bullets:
  - '`module8/examples/integration/` wires multiple utilities in one mini-env'
  - Tests under `module8/tests/pyuvm_tests/` prove utilities under simulation
  - 'Pattern: configure via CLP → run sequence → compare → record → report'
  notes: From MODULE8 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 8: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Utility-focused test methods
  bullets:
  - 'Comparator tests: equal/less/greater policies on transaction streams'
  - 'Recorder tests: verify log format and flush on phase boundaries'
  - 'CLP tests: plusargs override seed, verbosity, and test name'
  notes: From MODULE8 Verification & Testing Methods.
- type: bullets
  title: 2. Efficiency and reuse
  bullets:
  - Object pools cut allocation churn in high-transaction regressions
  - Queues order deferred checks or secondary stimulus
  - Random/string/math utils keep constraints readable in sequences
  notes: From MODULE8 Verification & Testing Methods.
- type: bullets
  title: 3. Closure
  bullets:
  - '`./scripts/module8.sh --check` across all utility examples'
  - 'Assessment: CLP, comparators, recorders, pools, queues, integration'
  - 'Capstone: combine utilities with Module 6/7 style envs in your own project'
  notes: From MODULE8 Verification & Testing Methods.
