- type: bullets
  title: Prerequisites
  bullets:
  - See module README
- type: image
  title: Learning path
  image: assets/diagrams/learning_path.png
  caption: Apply UVM to real-world verification scenarios
- type: bullets
  title: Overview
  bullets:
  - This module applies all learned concepts to real-world verification scenarios.
    You'll work on complete verification projects, learn industry best practices,
    and understand how to create production-quality verification en
- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 7: DUT structure and key interfaces (see common_dut/rtl/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 7: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. Real-world DUT blocks
  bullets:
  - '`module7/dut/dma/simple_dma.v` — DMA controller with channel descriptors'
  - '`module7/dut/protocols/uart.v` — serial framing for protocol agent labs'
  - Blocks represent IP-style interfaces students will see in SoC verification
  notes: From MODULE7 Design Architecture.
- type: bullets
  title: 2. Verification IP (VIP) architecture
  bullets:
  - Reusable agents package protocol knowledge (transactions, sequences, checkers)
  - Env composes DMA + UART (or other) agents with shared config and scoreboard fabric
  - Best-practices example shows directory layout, naming, and review-friendly TB
    structure
  notes: From MODULE7 Design Architecture.
- type: bullets
  title: 3. Integration view
  bullets:
  - Software-visible registers drive DMA; UART provides async serial path
  - Scoreboard and coverage span multiple IPs in one regression
  - Exercises push toward production-style reuse and documentation
  notes: From MODULE7 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 7: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Application-level test methods
  bullets:
  - 'DMA tests: descriptor programming, transfer completion, interrupt/status flags'
  - 'UART tests: baud framing, TX/RX loops, error injection in exercises'
  - VIP tests encapsulate protocol rules so tests focus on scenarios not bit toggling
  notes: From MODULE7 Verification & Testing Methods.
- type: bullets
  title: 2. Regression and sign-off practices
  bullets:
  - '`./scripts/module7.sh` runs DMA, protocol, VIP, and best-practices demos'
  - 'Layered regressions: smoke (short), nightly (full EXAMPLES), release (with coverage
    goals)'
  - Waveforms and transaction logs for post-mortem on failures
  notes: From MODULE7 Verification & Testing Methods.
- type: bullets
  title: 3. Closure
  bullets:
  - '`module7.sh --check`; assessment covers VIP reuse, protocols, and integration'
  - Prepares for Module 8 utilities used in production regressions (CLP, recorders)
  notes: From MODULE7 Verification & Testing Methods.
