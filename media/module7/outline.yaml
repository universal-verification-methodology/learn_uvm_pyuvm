  - This module applies all learned concepts to real-world verification scenarios.
    You'll work on complete verification projects, learn...
- type: section
  title: How to learn this module
- type: bullets
  title: Suggested learning path
  bullets:
  - Module 6 multi-agent protocol env is baseline — Module 7 applies it to DMA and
    UART IP blocks
  - Review `module7/dut/dma/simple_dma.v` register map and descriptor flow before
    DMA examples
  - Study `module7/dut/protocols/uart.v` framing (start bit, data, stop) for serial
    agent labs
  - VIP example packages reusable agents — focus on directory layout and naming for
    reuse
  - Best-practices example summarizes production-style TB structure before integrated
    tests
  notes: From docs/MODULE7.md — read guides before running demos.
- type: section
  title: Design architecture
- type: two_column
  title: 1. Real-world DUT blocks
  left:
  - '`module7/dut/dma/simple_dma.v` — DMA controller with channel descriptors'
  - '`module7/dut/protocols/uart.v` — serial framing for protocol agent labs'
  - Blocks represent IP-style interfaces students will see in SoC verification
  right: assets/diagrams/rtl_architecture.png
  notes: From MODULE7 Design Architecture.
- type: two_column
  title: 2. Verification IP (VIP) architecture
  left:
  - Reusable agents package protocol knowledge (transactions, sequences, checkers)
  - Env composes DMA + UART (or other) agents with shared config and scoreboard fabric
  - Best-practices example shows directory layout, naming, and review-friendly TB
    structure
  - VIP boundaries separate protocol expertise from scenario tests
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE7 Design Architecture.
- type: bullets
  title: 3. Execution pipeline
  bullets:
  - 'Build: Verilator compiles DMA and/or UART RTL; env builds VIP agents and shared
    infrastructure'
  - 'Connect: register bus agent + DMA status monitors + UART analysis paths into
    system scoreboard'
  - 'Sim: software-visible register writes program DMA; UART sequences inject serial
    traffic concurrently'
  - 'Check: DMA transfer completion flags, memory content, UART frame integrity —
    unified regression report'
  notes: From MODULE7 Design Architecture.
- type: bullets
  title: 4. Integration view
  bullets:
  - Software-visible registers drive DMA; UART provides async serial path
  - Scoreboard and coverage span multiple IPs in one regression
  - Exercises push toward production-style reuse and documentation
  - Module 8 utilities (CLP, recorders) plug into this env style in capstone work
  notes: From MODULE7 Design Architecture.
