    \ TLM module paths\ntry:\n    from pyuvm.s15_uvm_tlm_1 import uvm_seq_item_pull_port,\
    \ uvm_analysis_imp\nexcept (ImportError, AttributeError):\n    try:\n        from\
    \ pyuvm.s15_uvm_tlm import uvm_seq_item_pull_port, uvm_analysis_imp\n    except\
    \ (ImportError, AttributeError):\n        try:\n            from pyuvm.s16_uvm_tlm_1\
    \ import uvm_seq_item_pull_port, uvm_analysis_imp\n        except (ImportError,\
    \ AttributeError):\n// ..."
- type: section
  title: Key files to study
- type: bullets
  title: Open these in the repo
  bullets:
  - '`module7/dut/dma/simple_dma.v` — DMA controller with channel descriptors and
    status'
  - '`module7/dut/protocols/uart.v` — UART TX/RX serial interface for protocol agent
    labs'
  - '`module7/examples/dma/dma_example.py` — descriptor programming and transfer completion'
  - '`module7/examples/protocols/uart_example.py` — baud/framing stimulus and loopback
    checks'
  - '`module7/examples/vip/vip_example.py` — packaged verification IP agent pattern'
  - '`scripts/module7.sh` — `--dma`, `--protocols`, `--vip`, `--best-practices`, `--pyuvm-tests`'
  notes: Trace while running module7/EXAMPLES.md labs.
- type: section
  title: Verification & testing methods
- type: two_column
  title: 1. Application-level test methods
  left:
  - 'DMA tests: descriptor programming, transfer completion, interrupt/status flags'
  - 'UART tests: baud framing, TX/RX loops, error injection in exercises'
  - VIP tests encapsulate protocol rules so tests focus on scenarios not bit toggling
  right: assets/diagrams/testing_methods.png
  notes: From MODULE7 Verification & Testing Methods.
- type: bullets
  title: 2. Regression and sign-off practices
  bullets:
  - '`./scripts/module7.sh` runs DMA, protocol, VIP, and best-practices demos'
  - 'Layered regressions: smoke (short), nightly (full EXAMPLES), release (with coverage
    goals)'
  - Waveforms and transaction logs for post-mortem on failures
  notes: From MODULE7 Verification & Testing Methods.
- type: bullets
  title: 3. Step-by-step lab execution
  bullets:
  - '1. DMA block: `./scripts/module7.sh --dma` — program descriptor, confirm completion'
  - '2. UART protocol: `./scripts/module7.sh --protocols` — framing and loopback'
  - '3. VIP packaging: `./scripts/module7.sh --vip` — study reusable agent layout'
  - '4. Best practices: `./scripts/module7.sh --best-practices` — review TB structure
    checklist'
  - '5. Integrated: `./scripts/module7.sh --pyuvm-tests` — multi-IP regression pass'
  notes: From MODULE7 Verification & Testing Methods.
- type: bullets
  title: 4. Closure
  bullets:
  - '`./scripts/module7.sh --pyuvm-tests`; assessment covers VIP reuse, protocols,
    and integration'
  - Prepares for Module 8 utilities used in production regressions (CLP, recorders)
  - Articulate which checks live in VIP vs scenario test vs scoreboard
  notes: From MODULE7 Verification & Testing Methods.
