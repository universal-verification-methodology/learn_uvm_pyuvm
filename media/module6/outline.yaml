- type: bullets
  title: Debug concurrent traffic
  bullets:
  - Transaction logs plus UVM verbosity — trace AW/W ordering vs W data beats
  - Protocol checker failures often precede scoreboard mismatches — fix checker errors
    first
  - Waveforms on `awvalid/awready`, `wvalid/wready` for handshake stalls
  notes: Full detail in docs/MODULE6.md command reference.
