- type: image
  title: Learning path
  image: assets/diagrams/learning_path.png
  caption: Build complex multi-agent testbenches with protocol verification
- type: bullets
  title: Overview
  bullets:
  - This module focuses on building complex verification environments with multiple
    agents, protocol verification, advanced testbench architecture, and debugging
    techniques. You'll learn industry patterns and best practices.
- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 6: DUT structure and key interfaces (see common_dut/rtl/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 6: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. Protocol DUT architecture
  bullets:
  - '`module6/dut/protocols/axi4_lite_slave.v` — five-channel AXI4-Lite slave + memory
    interface'
  - Separate address/write/read response channels exercise real protocol timing
  - Multi-agent TB can attach initiator agents while DUT acts as slave
  notes: From MODULE6 Design Architecture.
- type: bullets
  title: 2. Complex testbench architecture
  bullets:
  - Multiple agents (e.g., master, memory, low-speed peripheral) under one `uvm_env`
  - Protocol checkers validate handshake rules independent of scoreboard
  - 'Layered scoreboards: per-agent checks + system-level consistency'
  - Architecture example documents reusable env patterns and package boundaries
  notes: From MODULE6 Design Architecture.
- type: bullets
  title: 3. Data flow
  bullets:
  - Virtual sequences coordinate cross-agent scenarios (config then traffic)
  - Monitors on each interface feed checkers and coverage
  - Reference models optional for memory content golden checks
  notes: From MODULE6 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 6: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Protocol verification methods
  bullets:
  - Protocol checker asserts AW/W/B/AR/R channel rules and ordering
  - Directed AXI transactions in `protocol_example.py` and `test_complex_testbench`
  - Multi-agent tests verify concurrent masters do not violate slave assumptions
  notes: From MODULE6 Verification & Testing Methods.
- type: bullets
  title: 2. System-level checking
  bullets:
  - Scoreboard correlates transactions across ports (address, data, response)
  - Architecture tests validate env wiring before long regressions
  - 'Debug: transaction logs, UVM verbosity, Verilator waveforms'
  notes: From MODULE6 Verification & Testing Methods.
- type: bullets
  title: 3. Closure
  bullets:
  - '`./scripts/module6.sh --check`; exercises extend multi-agent and protocol checkers'
  - 'Assessment: multi-agent envs, protocol verification, complex scoreboards, architecture
    patterns'
  notes: From MODULE6 Verification & Testing Methods.
