- type: bullets
  title: Suggested learning path
  bullets:
  - Module 5 multi-agent and virtual sequence patterns carry forward — AXI adds real
    protocol timing
  - Read `module6/dut/protocols/axi4_lite_slave.v` AW/W/B/AR/R channel interfaces
    before stimulus
  - Run `--multi-agent` and `--protocol` examples before `--protocol-checkers` and
    scoreboard labs
  - 'Understand initiator vs slave roles: DUT is slave; TB agents play masters/memory/peripheral'
  - Architecture example documents env packaging — study before `test_complex_testbench.py`
  notes: From docs/MODULE6.md — read guides before running demos.
- type: section
  title: Design architecture
- type: two_column
  title: 1. Protocol DUT architecture
  left:
  - '`module6/dut/protocols/axi4_lite_slave.v` — five-channel AXI4-Lite slave + memory
    interface'
  - Separate address/write/read response channels exercise real protocol timing
  - Multi-agent TB can attach initiator agents while DUT acts as slave
  right: assets/diagrams/rtl_architecture.png
  notes: From MODULE6 Design Architecture.
- type: two_column
  title: 2. Complex testbench architecture
  left:
  - Multiple agents (e.g., master, memory, low-speed peripheral) under one `uvm_env`
  - Protocol checkers validate handshake rules independent of scoreboard
  - 'Layered scoreboards: per-agent checks + system-level consistency'
  - Architecture example documents reusable env patterns and package boundaries
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE6 Design Architecture.
- type: bullets
  title: 3. Execution pipeline
  bullets:
  - 'Build: Verilator compiles AXI slave RTL; env instantiates master/memory/peripheral
    agents and checkers'
  - 'Connect: each agent monitor feeds protocol checker and scoreboard analysis ports'
  - 'Sim: virtual sequences configure agents then launch concurrent read/write traffic
    to slave'
  - 'Check: protocol checker asserts channel rules; scoreboard correlates addr/data/response
    across ports'
  notes: From MODULE6 Design Architecture.
- type: bullets
  title: 4. Data flow
  bullets:
  - Virtual sequences coordinate cross-agent scenarios (config then traffic)
  - Monitors on each interface feed checkers and coverage
  - Reference models optional for memory content golden checks
  - System scoreboard ties master observations to slave memory updates
  notes: From MODULE6 Design Architecture.
- type: code
  title: DUT — AXI4-Lite slave
  language: systemverilog
  source_file: module6/dut/protocols/axi4_lite_slave.v
  code: "/**\n * Module 6: AXI4-Lite Slave\n * \n * A simplified AXI4-Lite slave for\
    \ protocol verification.\n * \n * Ports:\n *   ACLK:     Clock signal\n *   ARESETn:\
    \  Active-low reset\n *   \n *   Write Address Channel:\n *   AWVALID:  Write\
    \ address valid\n *   AWREADY:  Write address ready\n *   AWADDR:   Write address\n\
    \ *   AWPROT:   Write protection type\n *   \n *   Write Data Channel:\n *   WVALID:\
    \   Write data valid\n *   WREADY:   Write data ready\n// ..."
- type: code
  title: Multi-agent testbench
  language: text
  source_file: module6/tests/pyuvm_tests/test_complex_testbench.py
  code: "\"\"\"\nModule 6 Test: Complex Testbench Test\nComplete testbench demonstrating\
    \ complex multi-agent environment.\n\"\"\"\n\nimport cocotb\nfrom cocotb.clock\
    \ import Clock\nfrom cocotb.triggers import Timer, RisingEdge\nfrom pyuvm import\
    \ *\n# Explicitly import uvm_seq_item_pull_port - it may not be exported by from\
    \ pyuvm import *\n# Try multiple possible import paths\n_uvm_seq_item_pull_port\
    \ = None\ntry:\n    # First try: check if it's in the namespace after from pyuvm\
    \ import *\n    _uvm_seq_item_pull_port = globals()['uvm_seq_item_pull_port']\n\
    except KeyError:\n    # Second try: import from pyuvm module directly\n    import\
    \ pyuvm\n// ..."
