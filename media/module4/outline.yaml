- type: image
  title: Learning path
  image: assets/diagrams/learning_path.png
  caption: Build complete UVM agents with driver, monitor, and sequencer
- type: bullets
  title: Overview
  bullets:
  - This module covers the core UVM components used to build verification environments.
    You'll learn how to create agents, drivers, monitors, sequencers, and sequences
    to build complete verification environments.
- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 4: DUT structure and key interfaces (see common_dut/rtl/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 4: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. DUT and interface protocol
  bullets:
  - '`module4/dut/interfaces/simple_interface.v` — valid/ready handshake, address/data/result
    buses'
  - Clocked, resettable interface models streaming transactions
  - Agent maps one transaction type to one interface beat
  notes: From MODULE4 Design Architecture.
- type: bullets
  title: 2. Agent-centric UVM architecture
  bullets:
  - Agent bundles driver, monitor, sequencer; env holds agent + scoreboard
  - TLM analysis ports connect monitor → scoreboard (and optional coverage)
  - '`InterfaceTransaction` defines fields, `copy`/`compare`, and constraints'
  - 'Complete path: sequence → sequencer → driver → DUT → monitor → scoreboard'
  notes: From MODULE4 Design Architecture.
- type: bullets
  title: 3. Component responsibilities
  bullets:
  - 'Driver: pull items from sequencer, drive pins per protocol'
  - 'Monitor: passive observation, broadcast transactions on analysis port'
  - 'Sequencer: arbitration and sequence execution'
  - 'Scoreboard: expected vs actual from monitor streams'
  notes: From MODULE4 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 4: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Integration testing method
  bullets:
  - '`test_complete_agent.py` — end-to-end agent, env, and test class'
  - 'Run: `./scripts/module4.sh --pyuvm-tests` or `make TEST=test_complete_agent`'
  - Per-component examples (`driver_example.py`, …) isolate behavior before integration
  notes: From MODULE4 Verification & Testing Methods.
- type: bullets
  title: 2. Checking strategy
  bullets:
  - Scoreboard compares monitored results to predicted model or golden vectors
  - Analysis port fan-out allows multiple checkers without changing monitor
  - Sequences provide repeatable stimulus; random/constrained extensions in exercises
  notes: From MODULE4 Verification & Testing Methods.
- type: bullets
  title: 3. Closure
  bullets:
  - Self-check via `module4.sh --check`; demo screenshots per EXAMPLES.md section
  - 'Assessment: drivers, monitors, sequencers, agents, scoreboards, TLM connections'
  notes: From MODULE4 Verification & Testing Methods.
