- type: bullets
  title: Overview
  bullets:
  - This module covers advanced UVM concepts including virtual sequences, coverage
    models, complex configuration, callbacks, and advanced register model usage. These
    concepts are essential for building sophisticated verifica
- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 5: DUT structure and key interfaces (see common_dut/rtl/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 5: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. Advanced DUT architecture
  bullets:
  - '`module5/dut/advanced/multi_channel.v` — multiple logical channels for coordination
    labs'
  - Designed for virtual sequences and multi-stream scoreboarding
  - Register abstraction layer examples align with memory-mapped control/status
  notes: From MODULE5 Design Architecture.
- type: bullets
  title: 2. Advanced UVM environment architecture
  bullets:
  - Virtual sequencers coordinate multiple agents on different channels
  - Coverage collectors sample transaction fields and cross coverage
  - Callbacks extend driver/monitor without subclass explosion
  - Configuration objects centralize knobs (active/passive, timeouts, enable flags)
  notes: From MODULE5 Design Architecture.
- type: bullets
  title: 3. Register model layer
  bullets:
  - 'RAL-style maps: registers, fields, access policies (RW, RO, WO)'
  - Adapter links bus transactions to register reads/writes in tests
  - Predictor/update paths keep mirror model consistent with DUT
  notes: From MODULE5 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 5: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Coverage-driven verification
  bullets:
  - Functional coverage on transaction types, channel IDs, and corner field values
  - Coverage goals gate regression sign-off in advanced flows
  - Examples under `module5/examples/coverage/` show sampling hooks
  notes: From MODULE5 Verification & Testing Methods.
- type: bullets
  title: 2. Virtual sequences and configuration tests
  bullets:
  - Virtual sequences start child sequences on multiple sequencers in order
  - Config tests prove ConfigDB + config object overrides change behavior
  - Callback tests inject errors or delays to validate robustness
  notes: From MODULE5 Verification & Testing Methods.
- type: bullets
  title: 3. Closure
  bullets:
  - '`./scripts/module5.sh --check`; register model and callback demos in EXAMPLES.md'
  - 'Assessment: virtual sequences, coverage, callbacks, configuration, register model'
  notes: From MODULE5 Verification & Testing Methods.
