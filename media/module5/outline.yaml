- type: section
  title: How to learn this module
- type: bullets
  title: Suggested learning path
  bullets:
  - Module 4 agent/scoreboard integration is prerequisite — multi-channel env extends
    the same TLM patterns
  - Review `module5/dut/advanced/multi_channel.v` — multiple logical channels needing
    coordinated stimulus
  - Study virtual sequencer concept before `virtual_sequences/` examples — one coordinator,
    many agents
  - 'Skim RAL terminology: register map, fields, adapter, predictor — used in `register_model/`'
  - Coverage and callbacks modify observation and driver behavior without deep subclass
    trees
  notes: From docs/MODULE5.md — read guides before running demos.
- type: section
  title: Design architecture
- type: two_column
  title: 1. Advanced DUT architecture
  left:
  - '`module5/dut/advanced/multi_channel.v` — multiple logical channels for coordination
    labs'
  - Designed for virtual sequences and multi-stream scoreboarding
  - Register abstraction layer examples align with memory-mapped control/status
  right: assets/diagrams/rtl_architecture.png
  notes: From MODULE5 Design Architecture.
- type: two_column
  title: 2. Advanced UVM environment architecture
  left:
  - Virtual sequencers coordinate multiple agents on different channels
  - Coverage collectors sample transaction fields and cross coverage
  - Callbacks extend driver/monitor without subclass explosion
  - Configuration objects centralize knobs (active/passive, timeouts, enable flags)
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE5 Design Architecture.
- type: bullets
  title: 3. Execution pipeline
  bullets:
  - 'Build: multi-channel RTL plus env with multiple agents, virtual sequencer, coverage,
    register model'
  - 'Connect: per-channel monitor analysis → scoreboard/coverage; RAL adapter linked
    to bus sequencer'
  - 'Sim: virtual sequence launches child sequences in order; callbacks may alter
    driver/monitor behavior mid-run'
  - 'Check: scoreboard per channel + coverage goals + register mirror consistency
    vs DUT state'
  notes: From MODULE5 Design Architecture.
- type: bullets
  title: 4. Register model layer
  bullets:
  - 'RAL-style maps: registers, fields, access policies (RW, RO, WO)'
  - Adapter links bus transactions to register reads/writes in tests
  - Predictor/update paths keep mirror model consistent with DUT
  - Register sequences replace raw bus wiggling for software-visible setup
  notes: From MODULE5 Design Architecture.
